<!doctype html>
<meta charset="utf-8">
<title>{{ image_id }}</title>
<link rel="stylesheet" href="/static/style.css">
<script>document.documentElement.dataset.theme = localStorage.theme || "dark";</script>
{% if next %}<link rel="prefetch" href="/rgb/{{ next }}">{% endif %}

<header id="bar" data-status="{{ status }}">
  <a href="/">&larr; all</a>
  {% if prev %}<a class="step" href="/shot/{{ prev }}">&larr;</a>{% else %}<span class="step dim">&larr;</span>{% endif %}
  {% if next %}<a class="step" href="/shot/{{ next }}">&rarr;</a>{% else %}<span class="step dim">&rarr;</span>{% endif %}
  <span>{{ image_id }}</span>
  <span class="dim">{{ position }}</span>
  <button data-set="keep">keep<span class="key">1</span></button>
  <button data-set="reject">reject<span class="key">0</span></button>
  <span id="pixel"></span>
  <button id="fit" aria-pressed="true" title="whole shot / native size">&#9974;</button>
  {% include "controls.html" %}
</header>
<div id="view"><img id="img" class="fit" src="/rgb/{{ image_id }}" alt=""></div>

<script src="/static/app.js"></script>
<script>
const image_id = "{{ image_id }}";
const prev = "{{ prev or '' }}";
const next = "{{ next or '' }}";
const bar = document.getElementById("bar");
const img = document.getElementById("img");
const pixel = document.getElementById("pixel");
const fit = document.getElementById("fit");

mountHeader(image_id);

// The pixels are read in the browser: the server never opens an image while serving.
let canvas = null;

function pixelAt(e) {
  if (!img.complete || !img.naturalWidth) return;
  if (!canvas) {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    canvas = c.getContext("2d", { willReadFrequently: true });
    canvas.drawImage(img, 0, 0);
  }
  // fit mode scales the image down, so the click has to go through the rendered box.
  const box = img.getBoundingClientRect();
  const x = Math.min(Math.floor((e.clientX - box.left) / box.width * img.naturalWidth), img.naturalWidth - 1);
  const y = Math.min(Math.floor((e.clientY - box.top) / box.height * img.naturalHeight), img.naturalHeight - 1);
  const [r, g, b] = canvas.getImageData(x, y, 1, 1).data;
  pixel.textContent = `RGB ${r} ${g} ${b}`;
}

// The shot opens whole. Native size opens on a corner of a 3000px image, which says nothing
// about the shot until the reviewer has scrolled, and only blur needs native size.
function toggleFit() {
  fit.setAttribute("aria-pressed", img.classList.toggle("fit"));
}

img.onclick = pixelAt;
img.ondblclick = toggleFit;
fit.onclick = toggleFit;

async function judge(status) {
  const want = bar.dataset.status === status ? "unjudged" : status;
  bar.dataset.status = await setStatus(image_id, want);
}

bar.onclick = (e) => {
  const button = e.target.closest("button[data-set]");
  if (button) judge(button.dataset.set);
};

// 1 and 0 sit in the order the buttons do, and judging leaves the shot on screen, exactly
// as pressing the button does. A key that also stepped on would put the misclick out of reach.
addEventListener("keydown", (e) => {
  if (e.code === "ArrowLeft" && prev) location.href = `/shot/${prev}`;
  if (e.code === "ArrowRight" && next) location.href = `/shot/${next}`;
  if (e.code === "Digit1") judge("keep");
  if (e.code === "Digit0") judge("reject");
});
</script>
