<!doctype html>
<meta charset="utf-8">
<title>scenepick</title>
<link rel="stylesheet" href="/static/style.css">
<script>document.documentElement.dataset.theme = localStorage.theme || "dark";</script>

<header>
  <span id="counts"></span>
  <label><input type="checkbox" id="only"> unjudged only</label>
  <span id="jump" hidden><input id="jump-to" inputmode="numeric" placeholder="scene" autocomplete="off">
    <span id="jump-said" class="dim"></span></span>
  {% include "controls.html" %}
</header>
<p id="ahead" hidden></p>
<div id="grid"></div>

<script src="/static/app.js"></script>
<script>
const grid = document.getElementById("grid");
const counts = document.getElementById("counts");
const only = document.getElementById("only");
const n = { unjudged: 0, keep: 0, reject: 0 };
let total = 0;

mountHeader(null);

function show() {
  counts.textContent =
    `${total} shots   keep ${n.keep}   reject ${n.reject}   unjudged ${n.unjudged}`;
}

grid.onclick = async (e) => {
  const button = e.target.closest("button[data-set]");
  if (!button) return;
  const cell = button.closest(".cell");
  const want = cell.dataset.status === button.dataset.set ? "unjudged" : button.dataset.set;
  const got = await setStatus(cell.dataset.id, want);
  n[cell.dataset.status]--;
  n[got]++;
  cell.dataset.status = got;
  show();
  tally(cell.closest("section"));
};

// Counted off the cells rather than kept alongside them, so the heading cannot drift out of
// step with what the grid shows. A group is small enough that recounting costs nothing.
function tally(section) {
  if (!section) return;
  const cells = section.querySelectorAll(".cell");
  let keep = 0;
  let reject = 0;
  for (const cell of cells) {
    if (cell.dataset.status === "keep") keep++;
    if (cell.dataset.status === "reject") reject++;
  }
  section.querySelector(".tally").textContent =
    `${cells.length} shots   keep ${keep}   reject ${reject}`;
}

// Filtering only on toggle (and on opening the grid), never on judgment: a cell that
// vanished the instant you clicked it could not be un-clicked.
function filter() {
  const cells = [...grid.querySelectorAll(".cell")];
  writeOnly(only.checked ? cells.filter(c => c.dataset.status === "unjudged").map(c => c.dataset.id) : null);
  for (const section of grid.children) {
    let shown = 0;
    for (const cell of section.querySelectorAll(".cell")) {
      cell.hidden = only.checked && cell.dataset.status !== "unjudged";
      shown += !cell.hidden;
    }
    section.hidden = !shown;
  }
}

only.onchange = filter;

const header = document.querySelector("header");
const jump = document.getElementById("jump");
const jumpTo = document.getElementById("jump-to");
const jumpSaid = document.getElementById("jump-said");

jumpTo.oninput = () => { jumpSaid.textContent = ""; };

// Kept from the page's own keys: a digit typed here is a scene number, never a shortcut.
jumpTo.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key !== "Enter") return;
  const name = jumpTo.value.trim();
  if (name) goTo(name);
};

// The scene goes into the address too, replaced rather than added, so a reload comes back to it
// and Back still leaves the grid in one step.
function goTo(name) {
  const section = [...grid.children].find(s => s.dataset.group === `scene ${name}`);
  if (!section) jumpSaid.textContent = `no scene ${name}`;
  // Said rather than jumped past: landing on the next scene would read as this one.
  else if (section.hidden) jumpSaid.textContent = `scene ${name}: no unjudged shots`;
  else {
    history.replaceState(null, "", `#scene=${encodeURIComponent(name)}`);
    bringUp(section);
  }
}

// Up to the header's bottom as drawn, not the 45px the stylesheet assumes: the glyph buttons
// set its height, and that follows the fonts of the machine (50px in Chrome on Windows).
// A cell is short until it is drawn and its thumbnail arrives, so the page grows as the scroll
// reaches it and one scroll can stop short of a late scene. Aligned again each frame, for up to
// a second, until it holds still for two.
function bringUp(section, until = performance.now() + 1000, still = 0) {
  const off = Math.floor(section.getBoundingClientRect().top - header.getBoundingClientRect().bottom);
  if (off) scrollBy(0, off);
  still = off ? 0 : still + 1;
  if (still < 2 && performance.now() < until) requestAnimationFrame(() => bringUp(section, until, still));
}

function cell(i) {
  return `<div class="cell" data-id="${i.image_id}" data-status="${i.status}">
    <a href="/shot/${i.image_id}"><img loading="lazy" src="/thumb/${i.image_id}" alt=""></a>
    <div class="row"><button data-set="keep">keep</button><button data-set="reject">reject</button></div>
  </div>`;
}

// One page, not one page per group: failures come in runs, so a group boundary must not
// interrupt comparing a shot with its neighbours. The heading only labels where it starts.
function draw(images) {
  if (!images[0].group) {
    grid.innerHTML = `<div class="cells">${images.map(cell).join("")}</div>`;
    return;
  }
  let html = "";
  let open = null;
  for (const i of images) {
    if (i.group !== open) {
      html += `${open === null ? "" : "</div></section>"}
        <section data-group="${i.group}"><h2 class="group">${i.group}<span class="tally"></span></h2>
        <div class="cells">`;
      open = i.group;
    }
    html += cell(i);
  }
  grid.innerHTML = `${html}</div></section>`;
  for (const section of grid.children) tally(section);
  jump.hidden = false;
}

// The shots are read ahead into memory from the start. Said here so the wait comes once, at
// the start, instead of a little at every shot; starting before it is done is allowed.
const ahead = document.getElementById("ahead");
let waited = false;

async function watchAhead() {
  const a = await (await fetch("/api/ahead")).json();
  if (a.have >= a.want) {
    if (!waited) return;
    ahead.textContent = "準備できました";
    setTimeout(() => { ahead.hidden = true; }, 3000);
    return;
  }
  waited = true;
  ahead.hidden = false;
  const left = a.seconds_left === null ? "" : `（あと約 ${a.seconds_left} 秒）`;
  ahead.textContent = `先に読み込んでいます ${a.have} / ${a.want}${left}。待たずに始めることもできます`;
  setTimeout(watchAhead, 1000);
}

watchAhead();

fetch("/api/images").then(r => r.json()).then(images => {
  total = images.length;
  for (const i of images) n[i.status]++;
  draw(images);
  show();
  // Left on from the last visit (here or on a shot), so it is set afresh to what is unjudged now.
  only.checked = Boolean(readOnly());
  if (only.checked) filter();
  // A shot's "← all" names its scene. Not on Back or Forward: those stay the browser's, as they
  // were before the address carried a scene.
  const scene = new URLSearchParams(location.hash.slice(1)).get("scene");
  if (scene && performance.getEntriesByType("navigation")[0]?.type !== "back_forward") goTo(scene);
});
</script>
